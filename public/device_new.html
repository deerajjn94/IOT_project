<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Device Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #eef4f8;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text: #122536;
      --muted: #718293;
      --blue: #168eea;
      --blue-dark: #126bb0;
      --border: #dce8f0;
      --shadow: 0 18px 45px rgba(36, 77, 103, 0.12);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(22, 142, 234, 0.12), transparent 32%),
        linear-gradient(135deg, #f7fbfd 0%, var(--page-bg) 100%);
      font-family: Arial, sans-serif;
    }

    .dashboard {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .dashboard-header,
    .brand,
    .card-heading {
      display: flex;
      align-items: center;
    }

    .dashboard-header {
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      gap: 13px;
    }

    .brand-icon,
    .device-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: linear-gradient(145deg, #168eea, #126bb0);
      box-shadow: 0 8px 18px rgba(22, 142, 234, 0.25);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 26px;
      transform: rotate(-12deg);
    }

    .device-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 20px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--blue-dark);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(21px, 4vw, 28px);
    }

    h2 {
      margin-bottom: 0;
      font-size: 19px;
    }

    .connection-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      color: #28734f;
      border: 1px solid #c9ead8;
      border-radius: 20px;
      background: #f0fff6;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .connection-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #31b86e;
      box-shadow: 0 0 0 4px rgba(49, 184, 110, 0.13);
    }

    .control-card {
      padding: 26px;
      border: 1px solid rgba(220, 232, 240, 0.9);
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .card-heading {
      justify-content: space-between;
      padding-bottom: 21px;
      border-bottom: 1px solid var(--border);
    }

    .device-selection {
      display: flex;
      align-items: end;
      gap: 12px;
      margin-top: 22px;
    }

    .device-field {
      flex: 1;
    }

    .device-field label {
      display: block;
      margin-bottom: 8px;
      color: #41586a;
      font-size: 12px;
      font-weight: bold;
    }

    .device-field select {
      width: 100%;
      padding: 13px 14px;
      color: var(--text);
      border: 1px solid #cbdce7;
      border-radius: 10px;
      outline: none;
      background: #f8fbfd;
      font: inherit;
    }

    .device-field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 142, 234, 0.12);
    }

    .config-button {
      padding: 12px 18px;
      color: white;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--blue), var(--blue-dark));
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .config-button:hover {
      filter: brightness(0.95);
    }

    .switch-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .device-control {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 112px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(248, 251, 253, 0.85);
    }

    .device-name {
      margin: 0 0 11px;
      color: #41586a;
      font-size: 12px;
      font-weight: bold;
    }

    .switch {
      position: relative;
      display: block;
      width: 44px;
      height: 76px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      display: block;
      border: 1px solid rgba(6, 38, 53, 0.2);
      border-radius: 5px;
      background: linear-gradient(
        to bottom,
        #168eea 0%,
        rgba(153, 199, 233, 0.55) 42%,
        transparent 100%
      );
      box-shadow:
        7px -4px 10px rgba(2, 32, 43, 0.18),
        inset 0 0 10px rgba(125, 211, 252, 0.12);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }

    .switch input:checked + .slider {
      background: linear-gradient(
        to top,
        #168eea 0%,
        rgba(153, 199, 233, 0.55) 42%,
        transparent 100%
      );
      box-shadow:
        7px 4px 14px rgba(2, 32, 43, 0.24),
        inset 0 0 10px rgba(125, 211, 252, 0.12);
    }

    .switch input:disabled + .slider {
      cursor: wait;
      opacity: 0.7;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .status-label {
      width: 100%;
      color: var(--muted);
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .status-led {
      width: 14px;
      height: 14px;
      border: 2px solid #b8c2c9;
      border-radius: 50%;
      background: #d5dadd;
    }

    .status-led[data-state="ON"] {
      border-color: #16a34a;
      background: #22c55e;
      box-shadow:
        0 0 6px #22c55e,
        0 0 14px rgba(34, 197, 94, 0.85);
    }

    .current-status {
      min-width: 62px;
      padding: 7px 10px;
      color: #dc2626;
      border: 1px solid rgba(220, 38, 38, 0.25);
      border-radius: 8px;
      background: rgba(254, 226, 226, 0.75);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
    }

    .current-status[data-state="ON"] {
      color: #16a34a;
      border-color: rgba(22, 163, 74, 0.25);
      background: rgba(220, 252, 231, 0.75);
    }

    .switch-hint {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .dashboard-footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 20px;
      color: #8a9aa6;
      font-size: 10px;
    }

    @media (max-width: 560px) {
      body {
        padding: 22px 14px;
      }

      .dashboard-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .control-card {
        padding: 18px;
      }

      .device-selection {
        align-items: stretch;
        flex-direction: column;
      }

      .config-button {
        width: 100%;
      }

      .switch-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">⌁</div>
        <div>
          <p class="eyebrow">IOT CONTROL CENTER</p>
          <h1>ESP32 Device Control</h1>
        </div>
      </div>

      <span class="connection-badge">
        <span class="connection-dot"></span>
        Live Monitoring
      </span>
    </header>

    <section class="control-card" aria-labelledby="control-title">
      <div class="card-heading">
        <div>
          <p class="eyebrow">DEVICE MANAGEMENT</p>
          <h2 id="control-title">Power Control</h2>
        </div>
        <div class="device-icon" aria-hidden="true">⌂</div>
      </div>

      <div class="device-selection">
        <div class="device-field">
          <label for="deviceDropdown">Select the device</label>
          <select id="deviceDropdown"></select>
        </div>

        <button id="configButton" class="config-button" type="button">
          Device Configuration
        </button>
      </div>

      <div class="switch-grid" id="switchGrid"></div>

      <p class="switch-hint">
        Tap a switch to change the device state
      </p>
    </section>

    <footer class="dashboard-footer">
      <span>ESP32 IoT Platform</span>
      <span>Secure device monitoring</span>
    </footer>
  </main>

  <script>
    const deviceControls = [];
    const confirmedStates = new WeakMap();
    let requestPending = false;
    let apiErrorShown = false;

    function getToken() {
      return sessionStorage.getItem("token");
    }

    function authHeaders(json = false) {
      const headers = {
        Authorization: "Bearer " + getToken()
      };

      if (json) {
        headers["Content-Type"] = "application/json";
      }

      return headers;
    }

    async function loadDevices() {
      const token = getToken();

      if (!token) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch("/api/devices", {
          headers: authHeaders()
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          window.location.href = "login.html";
          return;
        }

        const dropdown = document.getElementById("deviceDropdown");
        dropdown.innerHTML = "";

        data.devices.forEach((deviceId) => {
          const option = document.createElement("option");
          option.value = deviceId;
          option.textContent = deviceId;
          dropdown.appendChild(option);
        });

        await loadPinNames();
      } catch (error) {
        showApiError(error);
      }
    }

    async function loadPinNames() {
      const deviceId = document.getElementById("deviceDropdown").value;

      if (!deviceId) {
        return;
      }

      try {
        const res = await fetch(
          `/api/pinNames?device_id=${encodeURIComponent(deviceId)}`,
          {
            headers: authHeaders()
          }
        );

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || "Unable to load pin names");
        }

        const switchGrid = document.getElementById("switchGrid");
        switchGrid.innerHTML = "";
        deviceControls.length = 0;

        data.pins.forEach((pin) => {
          const pinKey = "pin" + pin.pin_number;

          const control = document.createElement("div");
          control.className = "device-control";
          control.dataset.pin = pinKey;

          control.innerHTML = `
            <label class="switch" aria-label="Toggle ${pin.pin_name}">
              <input type="checkbox" class="pin-toggle">
              <span class="slider"></span>
            </label>

            <div>
              <p class="device-name">${pin.pin_name}</p>
              <div class="status-indicator" aria-label="Current pin status">
                <span class="status-label">Status</span>
                <span class="status-led" data-state="OFF"></span>
                <span class="current-status"
                  data-state="OFF"
                  role="status"
                  aria-live="polite">OFF</span>
              </div>
            </div>
          `;

          switchGrid.appendChild(control);
          deviceControls.push(control);
          confirmedStates.set(control, "OFF");

          const toggle = control.querySelector(".pin-toggle");

          toggle.addEventListener("click", (event) => {
            event.preventDefault();

            if (!requestPending) {
              sendPinChange(control);
            }
          });
        });

        await refreshStatuses();
      } catch (error) {
        showApiError(error);
      }
    }

    function updatePinState(control, state) {
      const currentState =
        String(state).toUpperCase() === "ON" ? "ON" : "OFF";

      confirmedStates.set(control, currentState);

      const toggle = control.querySelector(".pin-toggle");
      const status = control.querySelector(".current-status");
      const led = control.querySelector(".status-led");

      toggle.checked = currentState === "ON";
      status.textContent = currentState;
      status.dataset.state = currentState;
      led.dataset.state = currentState;
    }

    async function sendPinChange(control) {
      if (requestPending) {
        return;
      }

      const deviceId = document.getElementById("deviceDropdown").value;
      const previousState = confirmedStates.get(control) || "OFF";
      const requestedState = previousState === "ON" ? "OFF" : "ON";

      const pins = {};

      deviceControls.forEach((item) => {
        const pin = item.dataset.pin;
        const state = item === control
          ? requestedState
          : confirmedStates.get(item) || "OFF";

        pins[pin] = state;
      });

      requestPending = true;
      deviceControls.forEach((item) => {
        item.querySelector(".pin-toggle").disabled = true;
      });

      try {
        const res = await fetch("/api/device/control", {
          method: "POST",
          headers: authHeaders(true),
          body: JSON.stringify({
            device_id: deviceId,
            pins
          })
        });

        const data = await res.json();

        if (!res.ok || data.success === false) {
          throw new Error(data.message || "Device control request failed");
        }

        await refreshStatuses();
        clearApiError();
      } catch (error) {
        updatePinState(control, previousState);
        showApiError(error);
      } finally {
        requestPending = false;
        deviceControls.forEach((item) => {
          item.querySelector(".pin-toggle").disabled = false;
        });
      }
    }

    async function refreshStatuses() {
      if (requestPending) {
        return;
      }

      const deviceId = document.getElementById("deviceDropdown").value;

      if (!deviceId) {
        return;
      }

      try {
        const res = await fetch(
          `/api/device/status?device_id=${encodeURIComponent(deviceId)}`,
          {
            headers: authHeaders()
          }
        );

        const data = await res.json();

        if (!res.ok || !data.success || !data.pins) {
          throw new Error(data.message || "No status found");
        }

        Object.entries(data.pins).forEach(([pin, state]) => {
          const control = deviceControls.find(
            (item) => item.dataset.pin === pin
          );

          if (control) {
            updatePinState(control, state);
          }
        });

        clearApiError();
      } catch (error) {
        showApiError(error);
      }
    }

    function showApiError(error) {
      if (!apiErrorShown) {
        alert("API error: " + error.message);
        apiErrorShown = true;
      }
    }

    function clearApiError() {
      apiErrorShown = false;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      document
        .getElementById("deviceDropdown")
        .addEventListener("change", async () => {
          await loadPinNames();
          await refreshStatuses();
        });

      document
        .getElementById("configButton")
        .addEventListener("click", () => {
          window.location.href = "device_config.html";
        });

      await loadDevices();

      setInterval(refreshStatuses, 2000);
    });
  </script>
</body>
</html>
