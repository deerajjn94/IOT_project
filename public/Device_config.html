<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Device Configuration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #eef4f8;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text: #122536;
      --muted: #718293;
      --blue: #168eea;
      --blue-dark: #126bb0;
      --border: #dce8f0;
      --shadow: 0 18px 45px rgba(36, 77, 103, 0.12);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(22, 142, 234, 0.12), transparent 32%),
        linear-gradient(135deg, #f7fbfd 0%, var(--page-bg) 100%);
      font-family: Arial, sans-serif;
    }

    .dashboard {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .dashboard-header,
    .brand,
    .card-heading {
      display: flex;
      align-items: center;
    }

    .dashboard-header {
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      gap: 13px;
    }

    .brand-icon,
    .device-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: linear-gradient(145deg, #168eea, #126bb0);
      box-shadow: 0 8px 18px rgba(22, 142, 234, 0.25);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 26px;
      transform: rotate(-12deg);
    }

    .device-icon {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    .device-icon:hover {
      filter: brightness(0.95);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--blue-dark);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(21px, 4vw, 28px);
    }

    h2 {
      margin-bottom: 0;
      font-size: 19px;
    }

    .connection-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      color: #28734f;
      border: 1px solid #c9ead8;
      border-radius: 20px;
      background: #f0fff6;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .connection-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #31b86e;
      box-shadow: 0 0 0 4px rgba(49, 184, 110, 0.13);
    }

    .control-card {
      padding: 26px;
      border: 1px solid rgba(220, 232, 240, 0.9);
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .card-heading {
      justify-content: space-between;
      padding-bottom: 21px;
      border-bottom: 1px solid var(--border);
    }

    .device-selection {
      display: flex;
      align-items: end;
      gap: 12px;
      margin-top: 22px;
    }

    .device-field {
      flex: 1;
    }

    .device-field label {
      display: block;
      margin-bottom: 8px;
      color: #41586a;
      font-size: 12px;
      font-weight: bold;
    }

    .device-field select {
      width: 100%;
      padding: 13px 14px;
      color: var(--text);
      border: 1px solid #cbdce7;
      border-radius: 10px;
      outline: none;
      background: #f8fbfd;
      font: inherit;
    }

    .device-field select:focus,
    .pin-name-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 142, 234, 0.12);
    }

    .pin-actions {
      display: flex;
      gap: 8px;
    }

    .action-button {
      padding: 12px 18px;
      color: white;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--blue), var(--blue-dark));
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-button:hover {
      filter: brightness(0.95);
    }

    .action-button.secondary {
      color: #41586a;
      border: 1px solid #cbdce7;
      background: #f8fbfd;
    }

    .action-button.secondary:hover {
      background: #eef5f9;
      filter: none;
    }

    .switch-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 28px;
    }

    .device-control {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 112px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(248, 251, 253, 0.85);
    }

    .device-name {
      margin: 0 0 11px;
      color: #41586a;
      font-size: 12px;
      font-weight: bold;
    }

    .pin-name-input {
      width: 100%;
      min-width: 0;
      padding: 8px 9px;
      color: var(--text);
      border: 1px solid #cbdce7;
      border-radius: 7px;
      outline: none;
      background: white;
      font: inherit;
      font-size: 12px;
    }

    .pin-name-input:disabled {
      padding: 0;
      color: #41586a;
      border-color: transparent;
      background: transparent;
      cursor: default;
    }

    .switch {
      position: relative;
      display: block;
      width: 44px;
      height: 76px;
      flex: 0 0 auto;
      cursor: default;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      display: block;
      border: 1px solid rgba(6, 38, 53, 0.2);
      border-radius: 5px;
      background: linear-gradient(
        to bottom,
        #168eea 0%,
        rgba(153, 199, 233, 0.55) 42%,
        transparent 100%
      );
      box-shadow:
        7px -4px 10px rgba(2, 32, 43, 0.18),
        inset 0 0 10px rgba(125, 211, 252, 0.12);
    }

    .pin-number {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .switch-hint {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .dashboard-footer {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 20px;
      color: #8a9aa6;
      font-size: 10px;
    }

    @media (max-width: 560px) {
      body {
        padding: 22px 14px;
      }

      .dashboard-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .control-card {
        padding: 18px;
      }

      .device-selection {
        align-items: stretch;
        flex-direction: column;
      }

      .pin-actions {
        width: 100%;
      }

      .action-button {
        flex: 1;
      }

      .switch-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">⌁</div>
        <div>
          <p class="eyebrow">IOT CONTROL CENTER</p>
          <h1>ESP32 Device Configuration</h1>
        </div>
      </div>

      <span class="connection-badge">
        <span class="connection-dot"></span>
        Configuration
      </span>
    </header>

    <section class="control-card" aria-labelledby="control-title">
      <div class="card-heading">
        <div>
          <p class="eyebrow">DEVICE MANAGEMENT</p>
          <h2 id="control-title">Pin Configuration</h2>
        </div>

        <button
          class="device-icon"
          type="button"
          aria-label="Go to devices"
          onclick="window.location.href='device.html'"
        >
          ⌂
        </button>
      </div>

      <div class="device-selection">
        <div class="device-field">
          <label for="deviceDropdown">Select the device</label>
          <select id="deviceDropdown"></select>
        </div>

        <div class="pin-actions">
          <button id="editPinsButton" class="action-button" type="button">
            Edit
          </button>

          <button
            id="savePinsButton"
            class="action-button"
            type="button"
            hidden
          >
            Save
          </button>

          <button
            id="cancelPinsButton"
            class="action-button secondary"
            type="button"
            hidden
          >
            Cancel
          </button>
        </div>
      </div>

      <div class="switch-grid" id="switchGrid"></div>

      <p class="switch-hint">
        Switches are shown for configuration preview only.
      </p>
    </section>

    <footer class="dashboard-footer">
      <span>ESP32 IoT Platform</span>
      <span>Secure device configuration</span>
    </footer>
  </main>

  <script>
    const deviceControls = [];
    let pins = [];
    let originalPinNames = [];
    let isEditing = false;
    let apiErrorShown = false;

    function getToken() {
      return sessionStorage.getItem("token");
    }

    function authHeaders(json = false) {
      const headers = {
        Authorization: "Bearer " + getToken()
      };

      if (json) {
        headers["Content-Type"] = "application/json";
      }

      return headers;
    }

    async function loadDevices() {
      const token = getToken();

      if (!token) {
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch("/api/devices", {
          headers: authHeaders()
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          window.location.href = "login.html";
          return;
        }

        const dropdown = document.getElementById("deviceDropdown");
        dropdown.innerHTML = "";

        data.devices.forEach((deviceId) => {
          const option = document.createElement("option");
          option.value = deviceId;
          option.textContent = deviceId;
          dropdown.appendChild(option);
        });

        await loadPinNames();
      } catch (error) {
        showApiError(error);
      }
    }

    async function loadPinNames() {
      const deviceId = document.getElementById("deviceDropdown").value;

      if (!deviceId) {
        return;
      }

      try {
        const res = await fetch(
          `/api/pinNames?device_id=${encodeURIComponent(deviceId)}`,
          {
            headers: authHeaders()
          }
        );

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || "Unable to load pin names");
        }

        pins = data.pins || [];
        renderPins();
        setEditMode(false);
        clearApiError();
      } catch (error) {
        showApiError(error);
      }
    }

    function renderPins() {
      const switchGrid = document.getElementById("switchGrid");
      switchGrid.innerHTML = "";
      deviceControls.length = 0;

      pins.forEach((pin) => {
        const control = document.createElement("div");
        control.className = "device-control";
        control.dataset.pin = "pin" + pin.pin_number;

        control.innerHTML = `
          <label class="switch" aria-label="${escapeHtml(pin.pin_name)}">
            <input type="checkbox" disabled>
            <span class="slider"></span>
          </label>

          <div>
            <p class="pin-number">Pin ${escapeHtml(pin.pin_number)}</p>
            <input
              class="pin-name-input"
              type="text"
              value="${escapeHtml(pin.pin_name)}"
              aria-label="Name for pin ${escapeHtml(pin.pin_number)}"
              disabled
            >
          </div>
        `;

        switchGrid.appendChild(control);
        deviceControls.push(control);
      });
    }

    function setEditMode(enabled) {
      isEditing = enabled;

      document.getElementById("editPinsButton").hidden = enabled;
      document.getElementById("savePinsButton").hidden = !enabled;
      document.getElementById("cancelPinsButton").hidden = !enabled;
      document.getElementById("deviceDropdown").disabled = enabled;

      document.querySelectorAll(".pin-name-input").forEach((input) => {
        input.disabled = !enabled;
      });
    }

    function startEditing() {
      originalPinNames = pins.map((pin) => pin.pin_name);
      setEditMode(true);
    }

    function cancelEditing() {
      pins.forEach((pin, index) => {
        pin.pin_name = originalPinNames[index];
      });

      renderPins();
      setEditMode(false);
      clearApiError();
    }

    async function savePinNames() {
      const inputs = document.querySelectorAll(".pin-name-input");
      const changedPins = [];
      const deviceId = document.getElementById("deviceDropdown").value;

      if (!deviceId) {
        return;
      }


      inputs.forEach((input, index) => {
        const newName = input.value.trim();

        if (!newName) {
          return;
        }

        if (newName !== pins[index].pin_name) {
          changedPins.push({
            pin: pins[index],
            newName
          });
        }
      });

      
      try {
        for (const item of changedPins) {
          const res = await fetch(
          `/api/updatePinName?device_id=${encodeURIComponent(deviceId)}`, 
          {
            method: "POST",
            headers: authHeaders(true),
            body: JSON.stringify({
              pin_number: item.pin.pin_number,
              new_name: item.newName
            })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            throw new Error(
              data.message || `Unable to update pin ${item.pin.pin_number}`
            );
          }

          item.pin.pin_name = item.newName;
        }

        renderPins();
        setEditMode(false);
        clearApiError();
      } catch (error) {
        showApiError(error);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showApiError(error) {
      if (!apiErrorShown) {
        alert("API error: " + error.message);
        apiErrorShown = true;
      }
    }

    function clearApiError() {
      apiErrorShown = false;
    }

    document.addEventListener("DOMContentLoaded", () => {
      document
        .getElementById("editPinsButton")
        .addEventListener("click", startEditing);

      document
        .getElementById("savePinsButton")
        .addEventListener("click", savePinNames);

      document
        .getElementById("cancelPinsButton")
        .addEventListener("click", cancelEditing);

      document
        .getElementById("deviceDropdown")
        .addEventListener("change", loadPinNames);

      loadDevices();
    });
  </script>
</body>
</html>
