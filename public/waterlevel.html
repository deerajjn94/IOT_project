<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Water Tank</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .tank-wrapper {
            --tank-top: 0cqw;
            position: relative;
            container-type: inline-size;
            width: min(300px, calc(100vw - 24px));
            padding-top: var(--tank-top);
        }

        .tank-wrapper::before {
            content: "";
            position: absolute;
            top: var(--tank-top);
            left: 50%;
            width: 50cqw;
            height: 9.3333cqw;
            transform: translate(-50%, -100%);
            border: 2cqw solid #fa4d16;
            border-bottom: 0;
            border-radius: 50% 50% 0 0;
            background: rgba(255, 255, 255, 0.1);
            z-index: 12;
            pointer-events: none;
        }

        .tank {
            position: relative;
            width: 90cqw;
            height: 133.3333cqw;
            margin: 0 auto;
            overflow: hidden;
            border: 2cqw solid #fa4d16;
            border-radius: 48% 48% 22% 22% / 15% 15% 8% 8%;
            background: #ffffff;
            box-shadow:
                inset 2.6667cqw 0 0 rgba(250, 77, 22, 0.08),
                inset -2.6667cqw 0 0 rgba(250, 77, 22, 0.08);
        }

        .tank::after {
            content: "";
            position: absolute;
            bottom: -1.3333cqw;
            left: 50%;
            width: 51.8519%;
            height: 2cqw;
            transform: translateX(-50%);
            border: 2cqw solid #fa4d16;
            border-bottom: 0;
            border-radius: 50% 50% 0 0;
            background: rgba(255, 255, 255, 0.1);
            z-index: 12;
            pointer-events: none;
        }

        .water {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: var(--water-level, 20%);
            background: #3586ff;
            transition: height 0.2s ease-in-out;
        }

        .waves {
            position: absolute;
            top: -10cqw;
            left: 0;
            width: 400cqw;
            height: 266.6667cqw;
        }

        .wave {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 33.3333cqw;
            background-image: url("https://uploads.onecompiler.io/44y7xzs48/1788024678290/wave.png");
            background-repeat: repeat-x;
            background-size: 100cqw 10cqw;
        }

        #wave1 {
            z-index: 1;
            opacity: 1;
            animation: waveMoveReverse 2s linear infinite;
        }

        #wave2 {
            z-index: 3;
            top: 0;
            opacity: 0.45;
            animation: waveMoveReverse 4s linear infinite;
        }

        #wave3 {
            z-index: 2;
            top: 0;
            opacity: 0.35;
            animation: waveMove 3s linear infinite;
        }

        #wave4 {
            z-index: 4;
            top: 0;
            opacity: 0.25;
            animation: waveMoveReverse 4s linear infinite;
        }

        @keyframes waveMove {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(25%);
            }
        }

        @keyframes waveMoveReverse {
            from {
                transform: translateX(-25%);
            }

            to {
                transform: translateX(0);
            }
        }

        .level-label {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 10.6667cqw;
            font-weight: bold;
            text-shadow: 0 0.6667cqw 1.6667cqw #000;
            pointer-events: none;
        }

        .controls {
            margin: 7.3333cqw auto 0;
            width: 90cqw;
            color: #333333;
            text-align: center;
        }

        .controls label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #fa4d16;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="tank-wrapper">
        <div class="tank">
            <div class="water" id="water">
                <div class="waves">
                    <div class="wave" id="wave1"></div>
                    <div class="wave" id="wave2"></div>
                    <div class="wave" id="wave3"></div>
                    <div class="wave" id="wave4"></div>
                </div>
            </div>

            <div class="level-label" id="levelLabel">50%</div>
        </div>

        <div class="controls">
            <label for="levelInput">
                Water Level: <span id="sliderValue">50%</span>
            </label>

            <input id="levelInput" type="range" min="0" max="100" value="50">
        </div>
    </div>

    <script>
        let dataValue = 50;

        const water = document.getElementById("water");
        const levelLabel = document.getElementById("levelLabel");
        const levelInput = document.getElementById("levelInput");
        const sliderValue = document.getElementById("sliderValue");

        function setWaterLevel(value) {
            const level = Math.max(0, Math.min(100, Number(value)));

            water.style.setProperty("--water-level", `${level}%`);
            levelLabel.textContent = `${level}%`;
            sliderValue.textContent = `${level}%`;
            levelInput.value = level;
        }

        levelInput.addEventListener("input", function () {
            setWaterLevel(this.value);
        });

        setWaterLevel(dataValue);
    </script>

</body>

</html>
