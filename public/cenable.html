<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Components Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        h2 {
            margin: 10px 0;
        }

        .controls {
            margin-bottom: 20px;
        }

        .component {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            background: #fff;
        }

        .switch-wrapper {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .switch-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .switch-content label {
            color: #222;
            font-size: 18px;
            font-weight: 600;
        }

        .switch-status {
            min-width: 70px;
            color: #2a1a12;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }

        .rocker-input {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
        }

        .rocker-switch {
            position: relative;
            width: 70px;
            height: 120px;
            cursor: pointer;
            perspective: 300px;
        }

        .rocker-lever {
            position: absolute;
            inset: 0;
            border: 2px solid #2a1a12;
            border-radius: 12px;
            background: linear-gradient(to bottom,
                    #fa4d16 0%,
                    #fba949 100%);
            box-shadow: 0 6px 18px #00000059, inset 0 1px 1px #ffffff26;
            transition: 0.3s ease;
            transform: rotateX(12deg);
        }

        .rocker-input:checked+.rocker-switch .rocker-lever {
            background: linear-gradient(to bottom,
                    #fba949 0%,
                    #fa4d16 100%);
            box-shadow: 0 -4px 14px #00000040, 0 8px 20px #e05a2b33;
            transform: rotateX(-12deg);
        }

        .rocker-lever::before,
        .rocker-lever::after {
            position: absolute;
            left: 50%;
            width: 30px;
            height: 3px;
            border-radius: 2px;
            content: "";
            transform: translateX(-50%);
        }

        .rocker-lever::before {
            top: 6px;
            background: #ffffff40;
        }

        .rocker-lever::after {
            bottom: 6px;
            background: #ffffff1f;
        }

        .lock-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
            background: rgba(212, 218, 224, 0);
        }

        .lock-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .lock-button {
            position: relative;
            width: 110px;
            height: 120px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .lock-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 82px;
            height: 72px;
            border: 3px solid #2a1a12;
            border-radius: 12px;
            background: linear-gradient(to bottom, #fa4d16 10%, #fba949 100%);
            box-shadow: 0 6px 18px #00000059, inset 0 1px 1px #ffffff26;
            transform: translateX(-50%);
            transition: 0.3s ease;
            overflow: visible;
        }

        .lock-shackle {
            position: absolute;
            top: 8px;
            left: 50%;
            width: 48px;
            height: 58px;
            border: 10px solid #2a1a12;
            border-bottom: 0;
            border-radius: 28px 28px 0 0;
            transform: translateX(-50%);
            transform-origin: right bottom;
            transition: 0.3s ease;
        }

        .lock-hole {
            position: absolute;
            top: 40px;
            left: 50%;
            width: 7px;
            height: 12px;
            border-radius: 8px;
            background: #2a1a12;
            transform: translateX(-50%);
        }

        .lock-button.unlocked .lock-shackle {
            transform: translateX(-50%) rotate(120deg);
        }

        .lock-button.unlocked .lock-body {
            background: linear-gradient(to bottom, #fa4d16 10%, #fba949 100%);
            box-shadow: 0 -4px 14px #00000040, 0 8px 20px #e05a2b33;
        }

        .lock-label,
        .lock-status {
            color: #2a1a12;
            font-size: 18px;
            font-weight: 700;
        }

        .lock-status {
            min-width: 100px;
            text-align: center;
        }

        .tank-wrapper {
            --tank-top: 0cqw;
            position: relative;
            container-type: inline-size;
            width: min(180px, calc(100vw - 24px));
            margin: 25px 0;
        }

        .tank-wrapper::before {
            content: "";
            position: absolute;
            top: calc(var(--tank-top) + 8px);
            overflow: visible;
            left: 50%;
            width: 50cqw;
            height: 9.3333cqw;
            transform: translate(-50%, -100%);
            border: 2cqw solid #fa4d16;
            border-bottom: 0;
            border-radius: 50% 50% 0 0;
            background: rgba(255, 255, 255, 0.1);
            z-index: 12;
            pointer-events: none;
        }

        .tank {
            position: relative;
            width: 90cqw;
            height: 133.3333cqw;
            margin: 0 auto;
            overflow: hidden;
            border: 2cqw solid #fa4d16;
            border-radius: 48% 48% 22% 22% / 15% 15% 8% 8%;
            background: radial-gradient(circle,
                    rgba(250, 77, 22, 0) 50%,
                    rgba(250, 77, 22, 0.1) 70%,
                    rgba(250, 77, 22, 0.4) 85%,
                    rgba(250, 77, 22, 1) 100%);
            box-shadow: inset 2.6667cqw 0 #fa4d1614, inset -2.6667cqw 0 #fa4d1614;
        }

        .water {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: var(--water-level, 10%);
            background: #3586ff;
            transition: height 0.2s ease-in-out;
        }

        .waves {
            position: absolute;
            top: -10cqw;
            left: 0;
            width: 400cqw;
            height: 266.6667cqw;
        }

        .wave {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 33.3333cqw;
            background-image: url("https://uploads.onecompiler.io/44y7xzs48/1788024678290/wave.png");
            background-repeat: repeat-x;
            background-size: 100cqw 10cqw;
        }

        #wave1 {
            z-index: 1;
            animation: waveMoveReverse 2s linear infinite;
        }

        #wave2 {
            z-index: 3;
            opacity: 0.45;
            animation: waveMoveReverse 4s linear infinite;
        }

        #wave3 {
            z-index: 2;
            opacity: 0.35;
            animation: waveMove 3s linear infinite;
        }

        #wave4 {
            z-index: 4;
            opacity: 0.25;
            animation: waveMoveReverse 4s linear infinite;
        }

        @keyframes waveMove {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(25%);
            }
        }

        @keyframes waveMoveReverse {
            from {
                transform: translateX(-25%);
            }

            to {
                transform: translateX(0);
            }
        }

        .level-label {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 1px 3px #000;
            pointer-events: none;
        }

        .tank-controls {
            width: 90cqw;
            margin: 15px auto 0;
            color: #333;
            text-align: center;
        }

        .tank-controls label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #fa4d16;
            cursor: pointer;
        }

        .temperature-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 30px;
            min-height: 280px;
            padding-left: 35px;
            padding-bottom: 35px;
        }

        .thermometer {
            position: relative;
            width: 70px;
            height: 260px;
            border: 4px solid rgba(250, 77, 22, 1);
            border-radius: 35px 35px 35px 35px;
            background: rgba(250, 77, 22, 0.2);
            box-shadow: inset 0 0 8px #0003;
        }

        .thermometer::after {
            content: "";
            position: absolute;
            bottom: -42px;
            left: 50%;
            width: 105px;
            height: 105px;
            border: 4px solid #555;
            border-radius: 50%;
            background: rgba(251, 169, 73, 1);
            transform: translateX(-50%);
            z-index: -1;
        }

        .temperature-tube {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 49px;
            height: 235px;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid rgba(250, 77, 22, 1);
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(-50%);
            background-size: 100% 20px;
        }

        .temperature-filled {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #1769ff, #ffcc00, #ff2b16);
        }

        .temperature-fill {
            position: absolute;
            top: 0;
            width: 100%;
            height: 50%;
            background: #ffffff;
            transition: height 0.1s ease;
        }

        .temperature-ticks {
            position: absolute;
            inset: 0;
            z-index: 4;
            width: 49px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 0;
            padding-left: 37px;
        }

        .temperature-ticks span {
            display: block;
            width: 65%;
            height: 1px;
            margin-left: auto;
            margin-right: 2px;
            background: rgba(40, 40, 40, 0.65);
        }

        .temperature-ticks span:nth-child(5n + 1) {
            width: 85%;
            height: 2px;
            background: rgba(40, 40, 40, 0.8);
        }

        .temperature-units {
            position: absolute;
            top: 8px;
            left: 50%;
            z-index: 5;
            width: 55px;
            padding: 7px 10px;
            border-radius: 8px;
            background: rgba(250, 77, 20, 0);
            color: #222;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .temperature-info {
            min-width: 250px;
        }

        .temperature-info h3 {
            margin-top: 0;
        }

        .temperature-controls {
            width: min(320px, 100%);
        }

        @media (max-width: 420px) {

            .switch-wrapper,
            .lock-wrapper {
                gap: 14px;
            }

            .switch-status,
            .lock-status {
                min-width: 55px;
                font-size: 16px;
            }

            .temperature-units {
                width: 145px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <h2>Enable/Disable Visuals</h2>

    <div class="controls">
        <label>
            <input type="checkbox" id="toggleSwitch">
            Show Switch Visual
        </label>
        <br>

        <label>
            <input type="checkbox" id="toggleLock" >
            Show Lock Visual
        </label>
        <br>

        <label>
            <input type="checkbox" id="toggleWater" >
            Show Water Level Visual
        </label>
        <br>

        <label>
            <input type="checkbox" id="toggleTemperature" checked>
            Show Temperature Visual
        </label>
    </div>

    <div id="switchComponent" class="component">
        <h2>Device Switch</h2>

        <div class="switch-wrapper">
            <div class="switch-content">
                <input type="checkbox" id="switch1" class="rocker-input" onchange="updateStatus(this)">

                <label class="rocker-switch" for="switch1">
                    <span class="rocker-lever"></span>
                </label>

                <label for="switch1">Device switch</label>
            </div>

            <span id="switchStatus" class="switch-status">OFF</span>
        </div>
    </div>

    <div id="lockComponent" class="component">
        <h2>Device Lock</h2>

        <div class="lock-wrapper">
            <div class="lock-content">
                <button id="lockButton" class="lock-button" type="button" aria-label="Unlock device">
                    <span class="lock-shackle"></span>
                    <span class="lock-body">
                        <span class="lock-hole"></span>
                    </span>
                </button>

                <span class="lock-label">Device lock</span>
            </div>

            <span id="lockStatus" class="lock-status">LOCKED</span>
        </div>
    </div>

    <div id="waterComponent" class="component">
        <h2>Water Level</h2>

        <div class="tank-wrapper">
            <div class="tank">
                <div class="water" id="water">
                    <div class="waves">
                        <div class="wave" id="wave1"></div>
                        <div class="wave" id="wave2"></div>
                        <div class="wave" id="wave3"></div>
                        <div class="wave" id="wave4"></div>
                    </div>
                </div>

                <div class="level-label" id="levelLabel">10%</div>
            </div>

            <div class="tank-controls">
                <label for="levelInput" style="color: #fa4d16">
                    Water Level: <span id="sliderValue">10%</span>
                </label>

                <input id="levelInput" type="range" min="0" max="100" value="10">
            </div>
        </div>
    </div>

    <div id="temperatureComponent" class="component">
        <h2>Temperature</h2>

        <div class="temperature-wrapper">
            <div class="thermometer">
                <div class="temperature-tube">
                    <div class="temperature-filled"></div>
                    <div class="temperature-fill" id="temperatureFill"></div>
                    <div class="temperature-ticks" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span>
                        <span></span>
                    </div>
                </div>

                <div class="temperature-units">
                    <span id="celsiusValue">25.0°C</span>
                    /
                    <span id="fahrenheitValue">77.0°F</span>
                </div>

                <div class="temperature-bulb"></div>
            </div>

            <div class="temperature-info">
                <div class="temperature-controls">
                    <label for="temperatureInput">
                        Temperature:
                        <span id="temperatureSliderValue">25.0°C</span>
                    </label>

                    <input id="temperatureInput" type="range" min="-50" max="150" value="25">
                </div>
            </div>
        </div>
    </div>

    <script>
        const switchComponent = document.getElementById("switchComponent");
        const lockComponent = document.getElementById("lockComponent");
        const waterComponent = document.getElementById("waterComponent");
        const temperatureComponent = document.getElementById("temperatureComponent");

        function setupVisibility(toggleId, component) {
            const toggle = document.getElementById(toggleId);

            function updateVisibility() {
                component.style.display = toggle.checked ? "block" : "none";
            }

            toggle.addEventListener("change", updateVisibility);
            updateVisibility();
        }

        setupVisibility("toggleSwitch", switchComponent);
        setupVisibility("toggleLock", lockComponent);
        setupVisibility("toggleWater", waterComponent);
        setupVisibility("toggleTemperature", temperatureComponent);

        function updateStatus(input) {
            document.getElementById("switchStatus").textContent =
                input.checked ? "ON" : "OFF";
        }

        const lockButton = document.getElementById("lockButton");
        const lockStatus = document.getElementById("lockStatus");

        lockButton.addEventListener("click", function () {
            const unlocked = this.classList.toggle("unlocked");

            lockStatus.textContent = unlocked ? "UNLOCKED" : "LOCKED";
            this.setAttribute("aria-label", unlocked ? "Lock device" : "Unlock device");
        });

        const water = document.getElementById("water");
        const levelLabel = document.getElementById("levelLabel");
        const levelInput = document.getElementById("levelInput");
        const sliderValue = document.getElementById("sliderValue");

        function setWaterLevel(value) {
            const level = Math.max(0, Math.min(100, Number(value)));

            water.style.setProperty("--water-level", `${level}%`);
            levelLabel.textContent = `${level}%`;
            sliderValue.textContent = `${level}%`;
            levelInput.value = level;
        }

        levelInput.addEventListener("input", function () {
            setWaterLevel(this.value);
        });

        const temperatureInput = document.getElementById("temperatureInput");
        const temperatureFill = document.getElementById("temperatureFill");
        const temperatureSliderValue = document.getElementById("temperatureSliderValue");
        const celsiusValue = document.getElementById("celsiusValue");
        const fahrenheitValue = document.getElementById("fahrenheitValue");

        function formatTemperature(value, unit) {
            return `${value.toFixed(1)} ${unit}`;
        }

        function updateTemperature() {
            const celsius = Number(temperatureInput.value);
            const fahrenheit = (celsius * 9 / 5) + 32;
            const thermometerLevel = 100-(((celsius + 50) / 200) * 100);

            temperatureFill.style.height = `${thermometerLevel}%`;
            celsiusValue.textContent = formatTemperature(celsius, "°C");
            fahrenheitValue.textContent = formatTemperature(fahrenheit, "°F");
            temperatureSliderValue.textContent = formatTemperature(celsius, "°C");
        }

        temperatureInput.addEventListener("input", updateTemperature);
        updateTemperature();
    </script>
</body>

</html>
