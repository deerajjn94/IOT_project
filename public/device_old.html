<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Device Control</title>
  <script>
  async function checkAuth() {
    const token = sessionStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
      return;
    }

    const res = await fetch("/api/checkAuth", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      }
    });
    const data = await res.json();

    if (!data.authenticated) {
      window.location.href = "login.html";
    }
  }

  checkAuth();
</script>


  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { color: #333; }
    #status { margin-top: 15px; font-weight: bold; }

    /* Toggle switch styles */
    .switch {
      position: relative;
      display: block;
      width: 76px;
      height: 140px;
      cursor: pointer;
    }
    .switch input {
      position: absolute;
      width: 0.5px;
      height: 0.5px;
      opacity: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 0.25px solid rgba(6, 38, 53, 0.411);
      border-radius: 5px;
      background: linear-gradient(
        to bottom,
        #168eea 0%,
        rgba(153, 199, 233, 0.55) 42%,
        transparent 100%
      );
      box-shadow:
        10px 6px 12px rgba(2, 32, 43, 0.297),
        inset 0 0 10px rgba(125, 211, 252, 0.12);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }
    .slider::after {
      content: "OFF";
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      transition: content 0.35s ease;
    }
    .switch input:checked + .slider {
      background: linear-gradient(
        to top,
        #168eea 0%,
        rgba(153, 199, 233, 0.55) 42%,
        transparent 100%
      );
      box-shadow:
        10px 0 18px rgba(2, 32, 43, 0.297),
        inset 0 0 10px rgba(125, 211, 252, 0.12);
    }
    .switch input:checked + .slider::after {
      content: "ON";
    }
    .switch input:focus-visible + .slider {
      outline: 2px solid #bae6fd;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <h2>ESP32 Device Control</h2>

  <!-- Device ID input -->
  <label for="device_id">Device ID:</label>
  <input type="text" id="device_id" placeholder="ESP32_LAB_01" />

  <!-- Toggle switch -->
  <label class="switch" aria-label="Toggle ESP32">
    <input type="checkbox" id="esp32Toggle" />
    <span class="slider"></span>
  </label>

  <!-- Status display -->
  <h3>Current Status</h3>
  <div id="status">Loading...</div>

  <script>
    const toggle = document.getElementById("esp32Toggle");

    toggle.addEventListener("change", async () => {
      const device_id = document.getElementById("device_id").value || "ESP32_LAB_01";
      const action = toggle.checked ? "ON" : "OFF";
      try {
        const res = await fetch("/api/device/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device_id, status: action })
        });
        const data = await res.json();
        alert("Command sent: " + action + " to " + device_id);
        refreshStatus();
      } catch (err) {
        alert("Error sending command: " + err);
      }
    });

    async function refreshStatus() {
      try {
        const res = await fetch("/api/device/status");
        const data = await res.json();
        document.getElementById("status").innerText =
          "Device: " + data.device_id + " | Status: " + data.status + " | Time: " + data.timestamp;

        // Sync toggle with actual device status
        toggle.checked = (data.status === "ON");
      } catch (err) {
        document.getElementById("status").innerText = "Error fetching status";
      }
    }

    // Refresh every 5 seconds
    setInterval(refreshStatus, 5000);
    refreshStatus();
  </script>
</body>
</html>
